<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form Submission</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 20px;
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    h2 {
      color: #0056b3;
    }

    .details {
      margin: 20px 0;
    }

    .details p {
      line-height: 1.6;
    }

    .details span {
      font-weight: bold;
    }

    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="details">
      <p><span>Name:</span> {{name}}</p>
      <p><span>Email:</span> {{email}}</p>
      <p><span>Message:</span></p>
      <p>{{message}}</p>
    </div>
  </div>
</body>

</html>
